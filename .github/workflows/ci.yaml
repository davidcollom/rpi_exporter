---
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -trimpath -count=1 -race ./...

      - name: Confirm build is reproducible (host arch)
        run: make build

      - name: Upload rpi_exporter binary
        uses: actions/upload-artifact@v7
        with:
          name: rpi_exporter-${{ runner.os }}-host
          path: rpi_exporter
          if-no-files-found: error

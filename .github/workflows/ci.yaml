---
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  GHCR_IMAGE: ghcr.io/davidcollom/rpi_exporter

jobs:
  lint:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so bumping it once there is enough.
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -trimpath -count=1 -race ./...

      - name: Verify goreleaser config
        # Only fails if we are missing a tool; we install goreleaser below
        # so this is intentionally minimal. Comment out if you do not yet
        # have goreleaser locally.
        run: |
          if command -v goreleaser >/dev/null 2>&1; then
            goreleaser check
          fi

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
            goarm: "7"
        exclude:
          - goos: darwin
            goarch: arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          if [ -z "${GOARM:-}" ]; then
            GOARM=0
          fi
          suffix="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "$GOARM" != "0" ]; then
            suffix="${suffix}v${GOARM}"
          fi
          mkdir -p "dist/${suffix}"
          # We use the Makefile target so the same ldflags (-X version, etc)
          # are used both locally and in CI.
          GOOS="${{ matrix.goos }}" \
          GOARCH="${{ matrix.goarch }}" \
          GO_VERSION="$(awk '/^go /{print $2; exit}' go.mod)" \
            make build-binary
          cp ./rpi_exporter "dist/${suffix}/rpi_exporter"
          chmod +x "dist/${suffix}/rpi_exporter"

      - name: Smoke test
        # Only run the binary on the runner's native architecture
        # (linux/amd64). Cross-compiled targets (linux/arm64, linux/arm/v7,
        # darwin/*) would just produce "Exec format error" — the build
        # itself is the verification for those.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          if [ -z "${GOARM:-}" ]; then
            GOARM=0
          fi
          suffix="${GOOS}-${GOARCH}"
          if [ "${GOARM}" != "0" ]; then
            suffix="${suffix}v${GOARM}"
          fi
          "./dist/${suffix}/rpi_exporter" --version

      - name: Verify cross-compiled artefact
        # For non-host targets just confirm the file was produced and is
        # non-empty. We rely on the build + `--version` smoke test on
        # linux/amd64 for actual functionality verification.
        if: matrix.goos != 'linux' || matrix.goarch != 'amd64'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          if [ -z "${GOARM:-}" ]; then
            GOARM=0
          fi
          suffix="${GOOS}-${GOARCH}"
          if [ "${GOARM}" != "0" ]; then
            suffix="${suffix}v${GOARM}"
          fi
          binary="dist/${suffix}/rpi_exporter"
          test -x "$binary" || { echo "::error::$binary is not executable"; exit 1; }
          size=$(wc -c < "$binary" | tr -d ' ')
          echo "  $binary built OK (${size} bytes)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rpi_exporter-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}/rpi_exporter
          if-no-files-found: error

  docker:
    # Single multi-arch build that produces a single manifest image.
    # Splitting per-platform would create N single-arch images in GHCR
    # which is more clutter than signal; this also lets the smoke
    # test pull a single image regardless of the runner's arch.
    name: docker (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short commit
        id: meta
        run: |
          commit=$(git rev-parse --short HEAD)
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          tag=$(git describe --tags --always --dirty 2>/dev/null || echo "$commit")
          go_version=$(awk '/^go /{print $2; exit}' go.mod)
          {
            echo "commit=$commit"
            echo "ts=$ts"
            echo "tag=$tag"
            echo "go_version=$go_version"
          } >> "$GITHUB_OUTPUT"

      # Push only on push to the default branch — PRs run a build-only
      # smoke test against the loaded amd64 image.
      #
      # The 'docker' exporter can't load multi-platform manifest lists,
      # so on PRs we build only linux/amd64 and load it into the daemon
      # for the smoke test; on push we build all three platforms and push
      # the multi-arch manifest to GHCR, then pull amd64 back for the
      # smoke test.
      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'push' && env.PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ${{ env.GHCR_IMAGE }}:dev
            ${{ env.GHCR_IMAGE }}:dev-${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.title=rpi_exporter
            org.opencontainers.image.description=Raspberry Pi hardware metrics exporter for Prometheus
            org.opencontainers.image.source=https://github.com/davidcollom/rpi_exporter
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.ts }}
            org.opencontainers.image.version=dev-${{ steps.meta.outputs.commit }}
          build-args: |
            VERSION=dev-${{ steps.meta.outputs.commit }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.ts }}
            GO_VERSION=${{ steps.meta.outputs.go_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR packages are private by default; flip to public on every push
      # so `docker pull ghcr.io/davidcollom/rpi_exporter:dev` works without
      # auth. Uses the built-in GITHUB_TOKEN, no extra secrets required.
      - name: Make GHCR package public
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For a user-owned package, the endpoint is
          # /user/packages/{package_type}/{package_name} — no owner
          # prefix in the path. For an org-owned package it would be
          # /orgs/{org}/packages/{package_type}/{package_name}.
          package_name="rpi_exporter"
          owner="${GITHUB_REPOSITORY%/*}"
          if [ "${owner}" = "davidcollom" ]; then
            # user namespace
            endpoint="/user/packages/container/${package_name}"
          else
            endpoint="/orgs/${owner}/packages/container/${package_name}"
          fi
          # The API may take a few seconds to become aware of a freshly
          # pushed image; retry on 404 for up to 30s.
          http_code=""
          for i in 1 2 3 4 5 6; do
            http_code=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -X PATCH \
              "${endpoint}" \
              -f visibility=public \
              --silent \
              --include \
              -i 2>/dev/null \
              | head -n1 \
              | awk '{print $2}')
            echo "GHCR ${owner}/${package_name} visibility=public (http ${http_code})"
            case "${http_code}" in
              2*) break ;;
              404) sleep 5 ;;
              *) break ;;
            esac
          done
          case "${http_code}" in
            2*) ;;
            *) echo "::error::GHCR visibility PATCH returned HTTP ${http_code}"; exit 1 ;;
          esac

      - name: Smoke test
        # PRs use the loaded image; pushes pull the just-published image
        # back from GHCR so we verify the actual pushed artifact.
        env:
          IMAGE: ${{ github.event_name == 'push' && format('{0}:dev', env.GHCR_IMAGE) || 'rpi_exporter_ci_smoke' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            docker tag "$IMAGE" "${{ env.GHCR_IMAGE }}:dev"
          else
            docker pull --platform linux/amd64 "$IMAGE"
          fi
          docker rm -f rpi_exporter_ci 2>/dev/null || true
          docker run --rm -d --name rpi_exporter_ci -p 19245:9243 "$IMAGE"
          sleep 3
          curl -fsS http://localhost:19245/health
          echo
          curl -fsS http://localhost:19245/metrics \
            | grep -E '^rpi_(exporter_build_info|scrape_collector_success){' \
            | head
          docker rm -f rpi_exporter_ci

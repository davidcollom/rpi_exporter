---
name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the version (resolved via svu)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
          - custom
      version:
        description: 'Version to release. Used only when release_type=custom. Must be a semver like `v1.2.3`.'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish (push to Docker Hub + create GitHub Release). Uncheck for a dry-run snapshot.'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false
  # Also support tag-push: a maintainer can `git tag v1.2.3 && git push
  # origin v1.2.3` and the release fires automatically. workflow_dispatch
  # remains available for ad-hoc runs.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # GITHUB_TOKEN needs: contents:write (release), packages:write (GHCR),
  # attestations:write (cosign SLSA provenance), id-token:write (cosign
  # keyless via OIDC). When the optional DOCKERHUB_TOKEN secret is set
  # the goreleaser-action also needs packages:write for the mirror.
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-version-file: go.mod is the single source of truth for the
          # toolchain — bumping it once in the `go` directive is enough.
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@latest

      # gh CLI is required for the "Make GHCR package public" step in
      # the goreleaser config (it talks to the GitHub Packages API to
      # flip the visibility of the package after the first push).
      - name: Install gh
        run: |
          apt-get update -qq && apt-get install -y -qq gh
          gh --version

      # `go-version-file: go.mod` is what the goreleaser ldflags
      # template references via `{{ .Env.GO_VERSION }}`. The Makefile
      # exports it too, but in CI we set it explicitly so it reaches
      # the goreleaser subprocess regardless of how the matrix is
      # wired.
      - name: Resolve version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM: ${{ inputs.version }}
        run: |
          # Two trigger paths:
          #   1. workflow_dispatch  - use svu (with optional custom override)
          #   2. push tag (v*)        - use github.ref_name (the pushed tag)
          if [ -n "${RELEASE_TYPE}" ]; then
            release_type="${RELEASE_TYPE}"
            custom="${CUSTOM:-}"
            case "$release_type" in
              custom)
                if [ -z "$custom" ]; then
                  echo "::error::release_type=custom requires the version input."
                  exit 1
                fi
                case "$custom" in
                  v*) ver="$custom" ;;
                  *)   ver="v$custom" ;;
                esac
                ;;
              prerelease) ver=$(svu prerelease) ;;
              patch)      ver=$(svu patch)      ;;
              minor)      ver=$(svu minor)      ;;
              major)      ver=$(svu major)      ;;
              *)
                echo "::error::unknown release_type=$release_type"
                exit 1
                ;;
            esac
          else
            # Push-tag trigger: github.ref_name is the tag (e.g. v1.0.0)
            ver="${GITHUB_REF_NAME}"
            case "$ver" in
              v*) ;;
              *) echo "::error::pushed ref $ver is not a v-prefixed semver tag"; exit 1 ;;
            esac
          fi

          go_version=$(awk '/^go /{print $2; exit}' go.mod)

          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"

      - name: Set up cosign for keyless signing
        # cosign ships its own binary via this installer; goreleaser then
        # shells out to it from the docker_signs block.
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub (if configured)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        env:
          GO_VERSION: ${{ steps.version.outputs.go_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" != "true" ]; then
            goreleaser release --clean --snapshot
          else
            # In goreleaser v2 the version is read from the git tag
            # automatically; there is no --release-version flag.
            goreleaser release --clean
          fi

---
name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the version (resolved via svu)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
          - custom
      version:
        description: 'Version to release. Used only when release_type=custom. Must be a semver like `v1.2.3`.'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish (push to GHCR + create GitHub Release). Uncheck for a dry-run snapshot.'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false
  # Also support tag-push: a maintainer can `git tag v1.2.3 && git push
  # origin v1.2.3` and the release fires automatically. workflow_dispatch
  # remains available for ad-hoc runs.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # GITHUB_TOKEN needs: contents:write (release), packages:write (GHCR).
  contents: write
  packages: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-version-file: go.mod is the single source of truth for the
          # toolchain — bumping it once in the `go` directive is enough.
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        # The default buildx driver on the GitHub Actions runner is
        # `docker`, which doesn't support multi-platform builds. We need
        # `docker-container` (or `kubernetes`) for goreleaser's
        # `dockers_v2` step to build for linux/amd64, linux/arm64, and
        # linux/arm/v7 in a single manifest.
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.20.2

      - name: Login to GHCR
        # GHCR rejects anonymous pushes (the 403 we saw in v1.0.1 was
        # exactly this). The GITHUB_TOKEN env var alone is not enough —
        # the goreleaser-spawned buildx needs a `~/.docker/config.json`
        # or a long-lived credential helper. We use docker/login-action
        # so the login is set up before goreleaser runs.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        # Branch on the trigger: on workflow_dispatch we trust the
        # maintainer input (svu or custom version), on tag-push the
        # pushed ref IS the version. The `release_type` input has a
        # default value (patch) so we can't use it as the discriminator.
        run: |
          event="${{ github.event_name }}"
          if [ "$event" = "workflow_dispatch" ]; then
            release_type="${{ inputs.release_type }}"
            custom="${{ inputs.version }}"
            case "$release_type" in
              custom)
                if [ -z "$custom" ]; then
                  echo "::error::release_type=custom requires the version input."
                  exit 1
                fi
                case "$custom" in
                  v*) ver="$custom" ;;
                  *)   ver="v$custom" ;;
                esac
                ;;
              prerelease) ver=$(svu prerelease) ;;
              patch)      ver=$(svu patch)      ;;
              minor)      ver=$(svu minor)      ;;
              major)      ver=$(svu major)      ;;
              *)
                echo "::error::unknown release_type=$release_type"
                exit 1
                ;;
            esac
          else
            # Push-tag trigger: github.ref_name is the tag (e.g. v1.0.1)
            ver="${GITHUB_REF_NAME}"
            case "$ver" in
              v*) ;;
              *) echo "::error::pushed ref $ver is not a v-prefixed semver tag"; exit 1 ;;
            esac
          fi

          go_version=$(awk '/^go /{print $2; exit}' go.mod)

          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        env:
          GO_VERSION: ${{ steps.version.outputs.go_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" != "true" ]; then
            goreleaser release --clean --snapshot
          else
            # In goreleaser v2 the version is read from the git tag
            # automatically; there is no --release-version flag.
            goreleaser release --clean
          fi

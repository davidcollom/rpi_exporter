---
name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the version (resolved via svu)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
          - custom
      version:
        description: 'Version to release. Used only when release_type=custom. Must be a semver like `v1.2.3`.'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish (push to Docker Hub + create GitHub Release). Uncheck for a dry-run snapshot.'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false
  # Also support tag-push as an alternative trigger: a maintainer can
  # `git tag v1.2.3 && git push origin v1.2.3` and the release fires
  # automatically. workflow_dispatch remains available for ad-hoc runs.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

# secrets.X is not allowed in step-level `if:`. Compute once at the
# workflow level whether the Docker Hub credentials are configured and
# use env.DOCKERHUB_PUSH to gate the optional Docker Hub steps. The
# value of this env var is a boolean string ("true"/"false"), not the
# secret itself.
env:
  IMAGE_NAME: davidcollom/rpi_exporter
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
  DOCKERHUB_REPO: docker.io/davidcollom/rpi_exporter
  GHCR_REPO: ghcr.io/davidcollom/rpi_exporter
  DOCKERHUB_PUSH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  validate:
    name: lint & pre-flight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so this workflow never has to
          # be edited when the toolchain is bumped.
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser + svu + syft
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          go install github.com/caarlos0/svu/v3@latest
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$RUNNER_TOOL_CACHE/go/bin"

      - name: go vet & test
        run: |
          go vet ./...
          go test -trimpath -count=1 ./...

      - name: Verify working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree has uncommitted changes; refusing to release."
            exit 1
          fi

      - name: Validate goreleaser config
        run: goreleaser check

  release-binaries:
    name: goreleaser (binaries, archives, SBOM, GitHub Release)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser + svu + syft
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          go install github.com/caarlos0/svu/v3@latest
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$RUNNER_TOOL_CACHE/go/bin"

      - name: Resolve version
        id: version
        run: |
          # Two trigger paths:
          #   1. workflow_dispatch  - use svu (with optional custom override)
          #   2. push tag (v*)        - use github.ref_name (the pushed tag)
          if [ -n "${{ inputs.release_type }}" ]; then
            release_type="${{ inputs.release_type }}"
            custom="${{ inputs.version }}"
            case "$release_type" in
              custom)
                if [ -z "$custom" ]; then
                  echo "::error::release_type=custom requires the version input."
                  exit 1
                fi
                case "$custom" in
                  v*) ver="$custom" ;;
                  *)   ver="v$custom" ;;
                esac
                ;;
              prerelease) ver=$(svu prerelease) ;;
              patch)      ver=$(svu patch)      ;;
              minor)      ver=$(svu minor)      ;;
              major)      ver=$(svu major)      ;;
              *)
                echo "::error::unknown release_type=$release_type"
                exit 1
                ;;
            esac
          else
            # Push-tag trigger: github.ref_name is the tag (e.g. v1.0.0)
            ver="${GITHUB_REF_NAME}"
            case "$ver" in
              v*) ;;
              *) echo "::error::pushed ref $ver is not a v-prefixed semver tag"; exit 1 ;;
            esac
          fi

          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; will reuse it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
          fi

      - name: Resolve goreleaser args
        id: args
        run: |
          args="release --clean --release-version ${{ steps.version.outputs.version }}"
          # Only honour inputs.publish when the workflow was triggered
          # manually. Tag-push releases always publish.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" != "true" ]; then
            args="$args --snapshot"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark GitHub Release as pre-release (if requested)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish && inputs.prerelease
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$VERSION" --prerelease

  release-image:
    name: docker (multi-arch)
    needs: [validate, release-binaries]
    # Run on workflow_dispatch (when publish=true) and on tag-push.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        # GITHUB_TOKEN is always available in Actions, so the GHCR push is
        # unconditional. The optional Docker Hub push happens when both
        # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are configured.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve metadata
        id: meta
        env:
          VERSION: ${{ needs.release-binaries.outputs.version }}
        run: |
          commit=$(git rev-parse --short HEAD)
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go_version=$(awk '/^go /{print $2; exit}' go.mod)
          major_minor=$(echo "$VERSION" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')
          {
            echo "tag=$VERSION"
            echo "commit=$commit"
            echo "ts=$ts"
            echo "go_version=$go_version"
            echo "major_minor=$major_minor"
          } >> "$GITHUB_OUTPUT"

      # The same build is pushed to GHCR (always) and Docker Hub (when
      # both Docker Hub secrets are present). A single multi-arch build
      # produces a single manifest reused across both registries via
      # a shared cache mount.
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.GHCR_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.GHCR_REPO }}:${{ steps.meta.outputs.major_minor }}
            ${{ env.GHCR_REPO }}:latest
          labels: |
            org.opencontainers.image.title=rpi_exporter
            org.opencontainers.image.description=Raspberry Pi hardware metrics exporter for Prometheus
            org.opencontainers.image.source=https://github.com/davidcollom/rpi_exporter
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=David Collom
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.ts }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.ts }}
            GO_VERSION=${{ steps.meta.outputs.go_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Re-tag the GHCR manifest for Docker Hub. We use `docker buildx
      # imagetools create` (built into the runner, no extra install) to
      # re-push the same multi-arch manifest under the docker.io path
      # so the two registries stay in lock-step without rebuilding.
      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_PUSH == 'true'
        run: |
          set -euo pipefail
          for suffix in "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.major_minor }}" latest; do
            echo "Mirroring ${{ env.GHCR_REPO }}:${suffix} -> ${{ env.DOCKERHUB_REPO }}:${suffix}..."
            docker buildx imagetools create \
              --tag "${{ env.DOCKERHUB_REPO }}:${suffix}" \
              "${{ env.GHCR_REPO }}:${suffix}"
          done

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          status=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -X PATCH \
            "/user/packages/container/${owner}%2Frpi_exporter" \
            -f visibility=public \
            --silent --output /dev/null --write-out '%{http_code}')
          echo "GHCR ${owner}/rpi_exporter visibility=public (http ${status})"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign GHCR image with keyless cosign
        env:
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          cosign sign --yes \
            --registry-username="${{ github.actor }}" \
            --registry-password="${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.GHCR_REPO }}@${{ steps.build.outputs.digest }}"

      - name: Sign Docker Hub image with keyless cosign
        if: env.DOCKERHUB_PUSH == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          dockerhub_digest=$(docker buildx imagetools inspect \
            "${{ env.DOCKERHUB_REPO }}:$VERSION" --raw \
            | jq -r '.manifests[0].digest // empty')
          if [ -z "$dockerhub_digest" ]; then
            echo "::error::failed to compute Docker Hub digest for $VERSION"
            exit 1
          fi
          cosign sign --yes \
            --registry-username="${{ github.actor }}" \
            --registry-password="${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.DOCKERHUB_REPO }}@$dockerhub_digest"

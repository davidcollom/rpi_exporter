---
name: release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How to bump the version (resolved via svu)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prerelease
          - custom
      version:
        description: 'Version to release. Used only when release_type=custom. Must be a semver like `v1.2.3`.'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish (push to Docker Hub + create GitHub Release). Uncheck for a dry-run snapshot.'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        required: false
        type: boolean
        default: false
  # Also support tag-push: a maintainer can `git tag v1.2.3 && git push
  # origin v1.2.3` and the release fires automatically. workflow_dispatch
  # remains available for ad-hoc runs.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # GITHUB_TOKEN needs: contents:write (release), packages:write (GHCR),
  # attestations:write (cosign SLSA provenance), id-token:write (cosign
  # keyless via OIDC). When the optional DOCKERHUB_TOKEN secret is set
  # the goreleaser-action also needs packages:write for the mirror.
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-version-file: go.mod is the single source of truth for the
          # toolchain — bumping it once in the `go` directive is enough.
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser + svu + syft
        # syft is required by goreleaser's `sboms:` step; install it
        # next to the other go-installed tools and add the directory to
        # $GITHUB_PATH so the goreleaser subprocess finds it.
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          go install github.com/caarlos0/svu/v3@latest
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$RUNNER_TOOL_CACHE/go/bin"
          echo "$RUNNER_TOOL_CACHE/go/bin" >> "$GITHUB_PATH"

      - name: Set up cosign for keyless signing
        # cosign ships its own binary via this installer; goreleaser then
        # shells out to it from the docker_signs block.
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub (if configured)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        env:
          GO_VERSION: ${{ steps.version.outputs.go_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" != "true" ]; then
            goreleaser release --clean --snapshot
          else
            # In goreleaser v2 the version is read from the git tag
            # automatically; there is no --release-version flag.
            goreleaser release --clean
          fi

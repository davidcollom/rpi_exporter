---
name: docker


on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  IMAGE_NAME: davidcollom/rpi_exporter
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  docker:
    name: ${{ matrix.platform }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (single arch, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:dev-${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=rpi_exporter
            org.opencontainers.image.description=Raspberry Pi hardware metrics exporter for Prometheus
            org.opencontainers.image.source=https://github.com/davidcollom/rpi_exporter
            org.opencontainers.image.licenses=Apache-2.0
          load: ${{ matrix.platform == 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test amd64 build (scrape /metrics)
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker run --rm -d --name rpi_exporter_smoke -p 19245:9243 ${{ env.IMAGE_NAME }}:dev-linux-amd64
          sleep 2
          curl -fsS http://localhost:19245/health
          echo
          # Verify the new metrics are exposed.
          curl -fsS http://localhost:19245/metrics | grep -E '^rpi_(exporter_build_info|scrape_collector_success){[^}]*=\d+}|^rpi_scrape_collector_duration_seconds{[^}]*=\d+' | head
          docker rm -f rpi_exporter_smoke

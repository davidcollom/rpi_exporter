# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# GoReleaser config for davidcollom/rpi_exporter.
#
# This single config produces everything for a release:
#
#   * Multi-arch static binary builds (linux/darwin × amd64/arm64,
#     plus linux/arm v7).
#   * tar.gz archives per OS/arch.
#   * Source tarball.
#   * SPDX SBOM (spdx-json) attached to each archive.
#   * SHA256SUMS.
#   * Multi-arch OCI image (linux/amd64, linux/arm64, linux/arm/v7)
#     built with the existing Dockerfile, pushed to
#     ghcr.io/davidcollom/rpi_exporter (and docker.io when the
#     DOCKERHUB_* secrets are configured).
#   * Keyless cosign signature on the OCI image (SLSA provenance).
#   * GitHub Release with auto-generated changelog grouped by
#     Conventional Commits type.
#
# Validated with `goreleaser check`. Snapshots with
# `goreleaser release --clean --snapshot`.

version: 2

project_name: rpi_exporter

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  # Static, stripped binaries for every supported OS/arch.
  # CGO_ENABLED=0 keeps the image small and lets us run on distroless.
  - id: rpi_exporter
    main: ./
    binary: rpi_exporter
    builder: go
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm

    # Inject build-time metadata so rpi_exporter_build_info{version,...}
    # is populated at build time without needing Makefile ldflags.
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.ShortCommit}}
      - -X github.com/prometheus/common/version.Branch={{.Branch}}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{.CommitDate}}
      - -X github.com/prometheus/common/version.GoVersion={{.Env.GO_VERSION}}

    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - rpi_exporter
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}-
      {{- title .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      -{{- else if eq .Arch "386" }}i386
      -{{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}_v{{ .Arm }}{{ end -}}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - src: systemd/rpi_exporter.service
        dst: etc/systemd/system/rpi_exporter.service
    allow_different_binary_count: false

# Plain source tarball (so consumers can vendor / packagers can re-build).
source:
  enabled: true
  prefix_template: "{{ .ProjectName }}-{{ .Version }}-src"

# SPDX SBOM. We use `artifacts: source` (one SBOM total, against the
# source tarball) rather than the default `archive` (one SBOM per
# archive) because goreleaser uploads them all under the same name
# (`spdx-json`), which causes 422 "already exists" errors when the
# GitHub Release API rejects duplicate names.
sboms:
  - id: spdx
    documents:
      - spdx-json
    artifacts: source

# Multi-arch OCI image. Built with the existing multi-stage
# Dockerfile and pushed via `docker buildx build` (no separate
# `docker build-push-action` step is needed in the workflow).
#
# `extra_files` makes the goreleaser build context explicit: goreleaser's
# default context is the project root, but the `COPY go.mod go.sum ./`
# line in the Dockerfile can occasionally be missed by the build
# daemon's internal context walk. Including the two files by name
# removes the ambiguity.
#
# GHCR is the primary image registry (free, no rate limits, integrated
# with GitHub via GITHUB_TOKEN). docker.io / Docker Hub is optional
# and can be re-enabled by adding it back to `images` and configuring
# the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets in repo settings.
dockers_v2:
  - id: rpi_exporter
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/davidcollom/rpi_exporter
    tags:
      - "{{ .Tag }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    extra_files:
      - LICENSE
      - README.md
      # The prebuilt static binaries are placed in the docker build
      # context by goreleaser's `dockers_v2` step itself (at
      # `linux/amd64/rpi_exporter`, `linux/arm64/rpi_exporter`, and
      # `linux/arm/v7/rpi_exporter`), so we don't need to add them
      # via extra_files.
    build_args:
      VERSION: "{{ .Tag }}"
      COMMIT: "{{ .ShortCommit }}"
      BUILD_DATE: "{{ .CommitDate }}"
      GO_VERSION: "{{ .Env.GO_VERSION }}"
    labels:
      org.opencontainers.image.title: rpi_exporter
      org.opencontainers.image.description: Raspberry Pi hardware metrics exporter for Prometheus
      org.opencontainers.image.source: https://github.com/davidcollom/rpi_exporter
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.vendor: David Collom
      org.opencontainers.image.revision: "{{ .ShortCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.version: "{{ .Tag }}"
    sbom: spdx

# Keyless cosign signing of the OCI image using the OIDC token
# provided by the GitHub Actions runner (`id-token: write`).
# Verifying:
#   cosign verify \
#     --certificate-identity-regexp 'https://github.com/davidcollom/rpi_exporter' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     ghcr.io/davidcollom/rpi_exporter:{{ .Tag }}
#
# `signature` is the local output path. We use a fixed `./cosign.sig`
# because `artifacts: checksum` only signs once (against the
# SHASUMS file), so there's no name-collision concern. Tag is
# derivable from `.Tag` if the file name needs to be per-release.
docker_signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: images
    # `output: false` is critical: with `output: true` goreleaser
    # appends `--output=true` to cosign, which tells cosign to use
    # the registry as the output and *not* write the local file.
    # That makes goreleaser fail when it tries to upload the local
    # signature as a release asset. With `output: false` goreleaser
    # adds `--output=<signature path>`, which makes cosign write the
    # signature to a local file *and* (because of --upload=true) push
    # it to the registry's OCI referrers.
    output: false
    signature: "./cosign.sig"
    args:
      - sign
      - "${artifact}"
      - --yes
      - --upload=true

# Auto-generated changelog, grouped by Conventional Commits type, scoped
# to commits not already in a previous tag.
changelog:
  use: git
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:!?:? .+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([^)]*\))?:!?:? .+$'
      order: 1
    - title: 'Performance'
      regexp: '^.*?perf(\([^)]*\))?:!?:? .+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([^)]*\))?:!?:? .+$'
      order: 3
    - title: 'Build / CI'
      regexp: '^.*?(build|ci)(\([^)]*\))?:!?:? .+$'
      order: 4
    - title: 'Docs'
      regexp: '^.*?docs(\([^)]*\))?:!?:? .+$'
      order: 5
    - title: Others
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^wip '
      - '^chore\(release\): '

release:
  github:
    owner: davidcollom
    name: rpi_exporter
  draft: false
  prerelease: auto
  # Overwrite existing assets with the same name on re-runs. Useful
  # when re-running a failed release (the GitHub Release object gets
  # created early; the assets are then re-uploaded with this flag).
  replace_existing_artifacts: true
  name_template: "{{ .Tag }}"
  header: |
    ## rpi_exporter {{ .Tag }}

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser) from
    `{{ .ShortCommit }}` on `{{ .CommitDate }}`. See the artifacts below.

    ### Install / pull

    ```sh
    # Primary (free, no rate limits):
    docker pull ghcr.io/davidcollom/rpi_exporter:{{ .Tag }}
    # Mirrored (when DOCKERHUB_TOKEN is configured):
    docker pull docker.io/davidcollom/rpi_exporter:{{ .Tag }}
    ```

    The multi-arch OCI image is signed with keyless cosign via SLSA
    provenance. See the [project README](https://github.com/davidcollom/rpi_exporter#readme)
    for usage.
  footer: |
    ## Verify

    The multi-arch OCI image is signed with keyless cosign via SLSA
    provenance. The image is published to both
    `ghcr.io/davidcollom/rpi_exporter` and
    `docker.io/davidcollom/rpi_exporter` (when credentials are
    configured). Verify before deploying:

    ```sh
    cosign verify \
      --certificate-identity-regexp 'https://github.com/davidcollom/rpi_exporter' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      ghcr.io/davidcollom/rpi_exporter:{{ .Tag }}
    ```
  include_meta: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# All retry configuration moved to the root of the config file.
retry:
  attempts: 3
  delay: 10s

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHASUMS.txt"
  algorithm: sha256
